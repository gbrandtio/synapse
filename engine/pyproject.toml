[project]
name = "synapse-engine"
version = "0.1.0"
description = "The local engine behind the Synapse desktop app."
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "httpx>=0.28,<1",
  "pydantic>=2,<3",
  "langgraph==1.2.19",
  "langchain-core>=1,<2",
  "langchain-openai>=1,<2",
  "fastembed==0.9.1",
  "onnxruntime==1.28.0",  # 1.29 and later send telemetry to Microsoft by default. See ADR 0019.
  "pypdfium2==5.14.0",
  "sqlite-vec==0.1.9",
  "numpy>=2,<3",
]

[project.scripts]
synapse-engine = "synapse_engine.__main__:main"

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "httpx",
  "ruff",
  "mypy",
  "import-linter",
  "fpdf2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF", "D1"]
ignore = ["D104", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "D", "E501"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src"]

[[tool.mypy.overrides]]
module = ["sqlite_vec.*", "pypdfium2.*", "fastembed.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "synapse_engine"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers point inward"
type = "layers"
layers = [
  "synapse_engine.__main__",
  "synapse_engine.api",
  "synapse_engine.adapters",
  "synapse_engine.application",
  "synapse_engine.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application import no frameworks"
type = "forbidden"
source_modules = ["synapse_engine.domain", "synapse_engine.application"]
forbidden_modules = ["fastapi", "langgraph", "langchain_core", "langchain_openai", "fastembed", "pypdfium2", "sqlite_vec"]
